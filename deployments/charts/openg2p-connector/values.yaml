global:
  connectorHostname: connector.qa.openg2p.org
  postgresqlHost: commons-postgresql
  postgresqlPort: 5432
  # When chart release name is "connector", keep short DB names; otherwise prefix.
  connectorDB: '{{ if eq .Release.Name "connector" }}connector{{ else }}{{ printf "%s_connector" .Release.Name | replace "-" "_" }}{{ end }}'
  connectorDBUser: '{{ if eq .Release.Name "connector" }}connector_user{{ else }}{{ printf "%s_connector_user" .Release.Name | replace "-" "_" }}{{ end }}'
  connectorDBSecret: '{{ if eq .Release.Name "connector" }}connector{{ else }}{{ .Release.Name }}-connector{{ end }}'
  connectorDBUserPasswordKey: '{{ if eq .Release.Name "connector" }}connector-db-user{{ else }}{{ .Release.Name }}-connector-db-user{{ end }}'
  redisHost: commons-redis-master
  redisPort: 6379
  redisDb: 1
  # In-cluster Partner API service name (no scheme). Chart builds the base URL.
  partnerApiService: registry-partner-api
  # Optional secret with DSNs for Connector UI metadata dropdowns.
  metadataDsnSecret: ""
  masterDataDsnKey: master_data_dsn
  registryDsnKey: registry_db_dsn

imagePullSecrets: []

# Shared runtime image for api / worker / beat / consumer.
image:
  repository: registry.gitlab.com/openg2p/openg2p-connector-service/connector-service
  tag: develop
  pullPolicy: Always

commonEnv:
  CONNECTOR_DB_DRIVER: postgresql+asyncpg
  CONNECTOR_LOG_LEVEL: INFO
  CONNECTOR_STORE_RUN_PAYLOADS: "false"
  CONNECTOR_STRICT_INCREMENTAL: "true"
  CONNECTOR_FULL_SCAN_ON_INCREMENTAL_UNSUPPORTED: "false"
  CONNECTOR_METRICS_ENABLED: "false"
  CONNECTOR_CORS_ORIGINS: ""

postgresCheckerInit:
  enabled: true
  image: jbergknoff/postgresql-client:latest

postgres-init:
  enabled: true
  postgresql:
    host: '{{ tpl .Values.global.postgresqlHost $ }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.connectorDB $ }}'
      user: '{{ tpl .Values.global.connectorDBUser $ }}'
      secret: '{{ tpl .Values.global.connectorDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.connectorDBUserPasswordKey $ }}'

api:
  enabled: true
  replicaCount: 1
  args:
    - api
  service:
    port: 80
    targetPort: 8050
  resources: {}
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

worker:
  enabled: true
  replicaCount: 1
  args:
    - worker
  resources: {}

beat:
  enabled: true
  replicaCount: 1
  args:
    - beat
  resources: {}

consumer:
  enabled: false
  replicaCount: 1
  args:
    - consumer
  resources: {}

ui:
  enabled: false
  replicaCount: 1
  image:
    repository: registry.gitlab.com/openg2p/openg2p-connector-ui/connector-ui
    tag: develop
    pullPolicy: Always
  service:
    port: 80
    targetPort: 8080
  resources: {}
  livenessPath: /
  readinessPath: /

istio:
  enabled: true
  gateway:
    create: false
    name: internal
  virtualservice:
    enabled: true
    gateway: internal
    # Routed to the API when UI is disabled; with UI, these go to API and / to UI.
    apiPrefixes:
      - /connectors
      - /runs
      - /dlq
      - /metadata
      - /health
      - /webhook
      - /docs
      - /openapi.json
      - /metrics
